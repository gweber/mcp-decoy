name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Audit dashboard production dependencies
        working-directory: dashboard
        run: npm audit --omit=dev

      - name: Build Docker image
        run: docker build -t mcp-decoy:ci .

      - name: Smoke-test Docker image
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 127.0.0.1:3911:3110 -e DASHBOARD_TOKEN=ci-token mcp-decoy:ci)
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3911/health >/tmp/mcp-decoy-health.json; then
              break
            fi
            sleep 0.25
          done
          cat /tmp/mcp-decoy-health.json
          grep '"version":"1.2.0"' /tmp/mcp-decoy-health.json
          test "$(curl -s -o /tmp/mcp-decoy-api-unauth.json -w '%{http_code}' http://127.0.0.1:3911/api/stats)" = "401"
          test "$(curl -s -o /tmp/mcp-decoy-api-auth.json -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://127.0.0.1:3911/api/stats)" = "200"
